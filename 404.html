<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(ellipse at bottom, #0b0c2b 0%, #000000 100%);
      color: #fff;
    }

    .stars {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
    }
    .message h1 {
      font-size: 80px;
      margin: 0;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700;
    }
    .message p {
      font-size: 24px;
      margin-top: 10px;
      color: #fff;
    }

    .planet {
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="message">
    <h1>404</h1>
    <p>Halaman tidak ditemukan</p>
    <p>Redirect ke Home dalam <span id="countdown">5</span> detik...</p>
  </div>

  <script>
    const ROOT_PATH = "/danikardinal/"; // Sesuaikan dengan repo
    const REDIRECT_TIME = 60; // detik
    let countdown = REDIRECT_TIME;

    // Bintang acak
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 150; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.width = star.style.height = (Math.random()*3 + 1) + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.animationDuration = (Math.random()*3 + 1) + "s";
      starsContainer.appendChild(star);
    }

    // Matahari
    function createPlanet(name, size, color, orbitRadius, duration) {
      const planet = document.createElement("div");
      planet.className = "planet";
      planet.style.width = planet.style.height = size + "px";
      planet.style.background = color;
      planet.style.top = `50%`;
      planet.style.left = `50%`;
      planet.style.margin = `-${size/2}px 0 0 -${size/2}px`;
      planet.style.animationName = `orbit-${name}`;
      planet.style.animationDuration = duration + "s";
      document.body.appendChild(planet);

      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes orbit-${name} {
          from { transform: rotate(0deg) translateX(${orbitRadius}px) rotate(0deg);}
          to { transform: rotate(360deg) translateX(${orbitRadius}px) rotate(-360deg);}
        }
      `;
      document.head.appendChild(style);
    }

    // Membuat semua planet
    createPlanet("sun", 80, "yellow", 0, 0); // Matahari diam di tengah
    createPlanet("mercury", 8, "#b1b1b1", 100, 10);
    createPlanet("venus", 14, "#e0c37f", 140, 18);
    createPlanet("earth", 16, "#3c80c9", 180, 24);
    createPlanet("mars", 12, "#c1440e", 220, 30);
    createPlanet("jupiter", 30, "#d9a066", 280, 50);
    createPlanet("saturn", 26, "#e3d0a6", 340, 60);
    createPlanet("uranus", 20, "#7fffd4", 400, 80);
    createPlanet("neptune", 20, "#4169e1", 460, 100);
    createPlanet("pluto", 6, "#c2b8b0", 500, 120);

    // Countdown timer
    const countdownElement = document.getElementById("countdown");
    const interval = setInterval(() => {
      countdown--;
      countdownElement.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(interval);
        window.location.replace(ROOT_PATH);
      }
    }, 1000);

  </script>
</body>
</html>
