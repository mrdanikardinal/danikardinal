<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>404 - Halaman Tidak Ditemukan</title>
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family:'Arial', sans-serif;
  background: radial-gradient(ellipse at bottom, #0b0c2b 0%, #000 100%);
  color:#fff;
}

.stars {
  position: fixed; /* fixed supaya full viewport selalu */
  top:0; left:0;
  width:100vw;
  height:100vh;
  z-index:0;
}
.star {
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:0.8;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle { from{opacity:0.2;} to{opacity:1;} }

.message {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  width: 90%;
  max-width: 400px;
}
.message h1 { font-size: 80px; margin:0; color:#ffd700; text-shadow:0 0 20px #ffd700; }
.message p { font-size: 24px; margin-top:10px; }

.tooltip { position:absolute; background:rgba(0,0,0,0.8); color:#fff; padding:5px 10px; border-radius:5px; font-size:16px; pointer-events:none; opacity:0; transition:0.2s; z-index:20; }
.popup { position:absolute; background: rgba(0,0,0,0.85); color:#fff; padding:15px; border-radius:10px; font-size:16px; display:none; z-index:21; max-width:220px; }

.planet { position: fixed; border-radius:50%; cursor:pointer; transition: transform 0.2s, box-shadow 0.2s; }
.meteor, .asteroid { position: fixed; border-radius:50%; z-index:2; }
.meteor { width:3px; height:3px; background:#fff; box-shadow:0 0 8px #fff; }
.asteroid { width:4px; height:4px; background:#ccc; }

@media (max-width:768px){
  .message h1 { font-size: 50px; }
  .message p { font-size: 18px; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="message">
  <h1>404</h1>
  <p>Halaman tidak ditemukan</p>
  <p>Redirect ke Home dalam <span id="countdown">120</span> detik...</p>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="popup" id="popup"></div>

<script>
const ROOT_PATH="/danikardinal/";
const REDIRECT_TIME=120;
let countdown=REDIRECT_TIME;

// Generate Stars
const starsContainer=document.getElementById("stars");
for(let i=0;i<300;i++){
  const star=document.createElement("div");
  star.className="star";
  star.style.width=star.style.height=(Math.random()*3+1)+"px";
  star.style.top=Math.random()*window.innerHeight+"px";
  star.style.left=Math.random()*window.innerWidth+"px";
  star.style.animationDuration=(Math.random()*3+2)+"s";
  starsContainer.appendChild(star);
}

// Tooltip & Popup
const tooltip=document.getElementById("tooltip");
const popup=document.getElementById("popup");

const planetsData=[
  {name:"Sun",size:120,color:"orange",a:0,b:0,speed:0,distance:0},
  {name:"Mercury",size:10,color:"#b1b1b1",a:120,b:110,speed:0.03,distance:57.9},
  {name:"Venus",size:16,color:"#e0c37f",a:170,b:150,speed:0.024,distance:108.2},
  {name:"Earth",size:18,color:"#3c80c9",a:220,b:200,speed:0.02,distance:149.6},
  {name:"Mars",size:14,color:"#c1440e",a:270,b:240,speed:0.016,distance:227.9},
  {name:"Jupiter",size:40,color:"#d9a066",a:340,b:300,speed:0.012,distance:778.5},
  {name:"Saturn",size:34,color:"#e3d0a6",a:410,b:360,speed:0.01,distance:1434},
  {name:"Uranus",size:26,color:"#7fffd4",a:480,b:420,speed:0.008,distance:2871},
  {name:"Neptune",size:26,color:"#4169e1",a:540,b:480,speed:0.006,distance:4495},
  {name:"Pluto",size:8,color:"#c2b8b0",a:600,b:540,speed:0.004,distance:5906}
];

const planets=[];
let paused=false;

// Create planets
planetsData.forEach(p=>{
  const planet=document.createElement("div");
  planet.className="planet";
  planet.style.width=planet.style.height=p.size+"px";
  planet.style.background=p.color;
  planet.style.top="50%";
  planet.style.left="50%";
  planet.style.margin=`-${p.size/2}px 0 0 -${p.size/2}px`;
  planet.style.boxShadow=p.name==="Sun" ? 
      `0 0 ${p.size*1.5}px #ff9933, 0 0 ${p.size}px #ff6600, 0 0 ${p.size/2}px #ffff66 inset` : 
      `0 0 ${p.size/2}px ${p.color}, inset -${p.size/4}px -${p.size/4}px 10px rgba(0,0,0,0.6)`;
  document.body.appendChild(planet);

  // Tooltip hover
  planet.addEventListener("mouseenter",()=>{ tooltip.textContent=p.name; tooltip.style.opacity=1; paused=true; });
  planet.addEventListener("mousemove",(e)=>{ tooltip.style.left=e.clientX+10+"px"; tooltip.style.top=e.clientY+10+"px"; });
  planet.addEventListener("mouseleave",()=>{ tooltip.style.opacity=0; paused=false; });

  // Popup click
  planet.addEventListener("click",(e)=>{
    popup.style.display="block";
    popup.style.left=e.clientX+10+"px";
    popup.style.top=e.clientY+10+"px";
    popup.innerHTML=`<b>${p.name}</b><br>Radius: ${p.size}px<br>Jarak Matahari: ${p.distance || 0} juta km<br>Kecepatan orbit: ${p.speed}`;
  });

  planets.push({element:planet,a:p.a,b:p.b,angle:Math.random()*2*Math.PI,speed:p.speed,name:p.name});
});

// Close popup
document.addEventListener("click",(e)=>{ if(!e.target.classList.contains("planet")) popup.style.display="none"; });

// Animate planets
function animatePlanets(){
  if(!paused){
    planets.forEach(p=>{
      p.angle+=p.speed;
      const x=window.innerWidth/2 + p.a*Math.cos(p.angle) - p.element.offsetWidth/2;
      const y=window.innerHeight/2 + p.b*Math.sin(p.angle) - p.element.offsetHeight/2;
      p.element.style.left=x+"px";
      p.element.style.top=y+"px";

      if(p.name!=="Sun"){
        const dx=x-window.innerWidth/2, dy=y-window.innerHeight/2;
        const light=Math.max(0.2, 0.8 - Math.sqrt(dx*dx+dy*dy)/1500);
        p.element.style.boxShadow=`0 0 ${p.element.offsetWidth/2}px rgba(255,255,255,${light}), inset -${p.element.offsetWidth/4}px -${p.element.offsetWidth/4}px ${10*light}px rgba(0,0,0,0.6)`;
      }
    });
  }
  requestAnimationFrame(animatePlanets);
}
animatePlanets();

// Asteroids & meteors
for(let i=0;i<120;i++){
  const a=document.createElement("div"); a.className="asteroid";
  a.style.top=Math.random()*window.innerHeight+"px";
  a.style.left=Math.random()*window.innerWidth+"px";
  document.body.appendChild(a);
}
function spawnMeteor(){
  const m=document.createElement("div");
  m.className="meteor";
  let startX=Math.random()*window.innerWidth;
  let startY=Math.random()*window.innerHeight/2;
  m.style.left=startX+"px";
  m.style.top=startY+"px";
  document.body.appendChild(m);
  const angle=Math.random()*Math.PI/3+Math.PI/6;
  const speed=5+Math.random()*5;
  let x=startX, y=startY;
  const id=setInterval(()=>{
    x+=Math.cos(angle)*speed;
    y+=Math.sin(angle)*speed;
    m.style.left=x+"px";
    m.style.top=y+"px";
    if(x>window.innerWidth || y>window.innerHeight){ clearInterval(id); m.remove(); }
  },16);
}
setInterval(spawnMeteor,120);

// Countdown redirect
const countdownElement=document.getElementById("countdown");
const interval=setInterval(()=>{
  countdown--;
  countdownElement.textContent=countdown;
  if(countdown<=0){ clearInterval(interval); window.location.replace(ROOT_PATH); }
},1000);

</script>
</body>
</html>
